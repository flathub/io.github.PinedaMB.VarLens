app-id: io.github.PinedaMB.VarLens
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: varlens

finish-args:
  # Wayland & X11 fallback
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # OpenGL / GPU rendering
  - --device=dri

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/varlens/cargo-home

modules:
  - name: varlens
    buildsystem: simple
    build-commands:
      - cargo --offline build --locked --release --verbose
      - install -Dm755 target/release/varlens -t /app/bin/
      - install -Dm644 data/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 data/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 data/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: git
        url: https://github.com/PinedaMB/VarLens.git
        tag: v1.1.0
        commit: a114c53d9629947c425c41f3f7a4d379d24c580d
        x-checker-data:
          type: json
          url: https://api.github.com/repos/PinedaMB/VarLens/releases/latest
          tag-query: .tag_name
          version-query: '$tag | ltrimstr("v")'
          timestamp-query: .published_at
          is-main-source: true
      - cargo-sources.json
